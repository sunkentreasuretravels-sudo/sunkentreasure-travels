<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore | Sunken Treasure Travels®</title><link rel="stylesheet" href="/assets/css/reset.css"><link rel="stylesheet" href="/assets/css/variables.css"><link rel="stylesheet" href="/assets/css/typography.css"><style>body{background:#061522;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:70px 24px}.back{color:#8fcce2}.eyebrow{margin-top:60px;color:#8fcce2;text-transform:uppercase;letter-spacing:.16em;font-size:.75rem}h1{font-family:"Playfair Display",serif;font-size:clamp(2.5rem,6vw,5rem);line-height:1;margin:.3em 0}p{color:rgba(255,255,255,.72);line-height:1.7;font-size:1.05rem}.card{margin-top:30px;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:25px;background:rgba(255,255,255,.04)}</style></head><body><main class="wrap"><a class="back" href="/index.html#map">← Back to the world map</a><div id="content"></div></main><script type="module">
const qs=new URLSearchParams(location.search), type=qs.get('type'), id=qs.get('id');
const files=type==='event'?['/data/destinations/events.json']:['/data/destinations/destinations.json'];
const rows=await fetch(files[0]).then(r=>r.json()); const item=rows.find(x=>x.id===id); const root=document.querySelector('#content');
if(!item){root.innerHTML='<div class="eyebrow">Explore</div><h1>We could not find that place.</h1><p>Return to the map and choose another highlighted location.</p>';}
else{document.title=`${item.name} | Sunken Treasure Travels®`;root.innerHTML=`<div class="eyebrow">${type==='event'?'Event':'Destination'} · ${item.location||item.category||''}</div><h1>${item.name}</h1><div class="card"><p>${item.description||''}</p><p><strong>Highlighted, not limiting.</strong> This marker represents a curated point of interest in the Sunken Treasure Travels® ecosystem. It does not mean other cities or nearby destinations are unavailable.</p></div>`;}
</script></body></html>
