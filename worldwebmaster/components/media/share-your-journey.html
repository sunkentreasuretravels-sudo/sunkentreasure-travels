<section aria-labelledby="share-title">
  <h2 id="share-title">Share Your Journey</h2>
  <p>Share photos or video from your experience. Submissions are reviewed before appearing publicly.</p>
  <form enctype="multipart/form-data">
    <label>Name <input name="name" autocomplete="name"></label>
    <label>Email <input name="email" type="email" autocomplete="email"></label>
    <label>Photos / Video <input name="media" type="file" accept="image/*,video/*" multiple required></label>
    <label>Caption <textarea name="caption"></textarea></label>
    <label><input type="checkbox" name="consentToPublish" required> I give permission for approved submissions to be published.</label>
    <button type="submit">Submit for Review</button>
  </form>
</section>
<script>
document.querySelector("form").addEventListener("submit", (event) => {
  event.preventDefault();
  alert("Production upload endpoint will be connected through the WorldWebMaster API.");
});
</script>
